[package]
name = "mzani"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
authors = ["Jamal Lyons"]
description = "A std-only HTTP/1.x load balancer with health checks, graceful shutdown, and structured metrics"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/JamalLyons/Mzani"
documentation = "https://docs.rs/mzani"
keywords = ["load-balancer", "http", "proxy", "reverse-proxy", "stdlib"]
categories = ["network-programming", "web-programming::http-server"]
exclude = ["/mock/", "/.cursor/"]

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
perf = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[[example]]
name = "minimal_proxy"
path = "examples/minimal_proxy.rs"
